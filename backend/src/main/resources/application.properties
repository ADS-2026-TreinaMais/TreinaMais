# Configuração Geral do Servidor (porta 8081 para não conflitar com httpd/XAMPP na 8080)
server.port=${PORT:8081}
spring.application.name=treinamais-backend

# Carrega variáveis do arquivo backend/.env (opcional). O caminho é relativo ao diretório
# de execução, por isso aceita rodar tanto a partir de backend/ quanto da raiz do repositório.
# Variáveis de ambiente do sistema operacional continuam tendo prioridade sobre o .env.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Perfil ativo padrão: prod (PostgreSQL no Docker)
spring.profiles.active=prod

# Configurações do JWT
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000

# API externa ExerciseDB V1 (open-source)
exercisedb.api.base-url=${EXERCISEDB_BASE_URL:https://oss.exercisedb.dev/api/v1}
exercisedb.api.timeout-ms=${EXERCISEDB_TIMEOUT_MS:5000}
exercisedb.cache.ttl-hours=${EXERCISEDB_CACHE_TTL_HOURS:24}
